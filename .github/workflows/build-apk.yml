name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/build-apk.yml"]

permissions:
  contents: write   # to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing key and web address
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            HOST="$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -r .project_id).web.app"
          else
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret not set; building against a placeholder address."
            HOST="example.web.app"
          fi
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
            PASS="$ANDROID_KEYSTORE_PASSWORD"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set; signing with a throwaway key (updates won't install over this build)."
            PASS="throwaway-$(openssl rand -hex 8)"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias taskreminder -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -dname "CN=Task Reminder" -noprompt
          fi
          echo "::add-mask::$PASS"
          {
            echo "HOST=$HOST"
            echo "KS=$KS"
            echo "KS_PASS=$PASS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          gradle -p android assembleRelease --no-daemon \
            -PhostName="$HOST" -PversionCode="${{ github.run_number }}" \
            -PkeystorePath="$KS" -PkeystorePassword="$KS_PASS"
          cp android/app/build/outputs/apk/release/app-release.apk task-reminder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: task-reminder-apk
          path: task-reminder.apk

      - name: Publish release (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Task Reminder APK (build ${{ github.run_number }})
          body: Download `task-reminder.apk` below on your phone and open it to install.
          files: task-reminder.apk
          make_latest: true
