name: Deploy web app

on:
  push:
    branches: [main]
    paths: ["web/**", "firebase.json", "firestore.rules", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT secret first (see README)."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "PROJECT_ID=$(jq -r .project_id "$RUNNER_TEMP/sa.json")" >> "$GITHUB_ENV"

      # Proves to Android that the APK and the website belong together, so the
      # app opens full-screen without a browser URL bar.
      - name: Write Digital Asset Links
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret; skipping assetlinks.json (the APK will show a URL bar)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          SHA=$(keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias taskreminder \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          mkdir -p web/.well-known
          cat > web/.well-known/assetlinks.json <<JSON
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "com.anshmick27.taskreminder",
              "sha256_cert_fingerprints": ["$SHA"]
            }
          }]
          JSON
          cat web/.well-known/assetlinks.json

      # Short-lived Google access token for the REST calls below.
      - name: Get access token
        run: |
          SA="$RUNNER_TEMP/sa.json"
          EMAIL=$(jq -r .client_email "$SA")
          echo "Service account: $EMAIL"
          jq -r .private_key "$SA" > "$RUNNER_TEMP/key.pem"
          b64() { openssl base64 -e -A | tr '+/' '-_' | tr -d '='; }
          NOW=$(date +%s)
          HEAD=$(printf '{"alg":"RS256","typ":"JWT"}' | b64)
          CLAIMS=$(printf '{"iss":"%s","scope":"https://www.googleapis.com/auth/cloud-platform","aud":"https://oauth2.googleapis.com/token","iat":%s,"exp":%s}' "$EMAIL" "$NOW" "$((NOW + 1800))" | b64)
          SIG=$(printf '%s.%s' "$HEAD" "$CLAIMS" | openssl dgst -sha256 -sign "$RUNNER_TEMP/key.pem" | b64)
          rm -f "$RUNNER_TEMP/key.pem"
          TOKEN=$(curl -sS https://oauth2.googleapis.com/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer -d assertion="$HEAD.$CLAIMS.$SIG" | jq -r .access_token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = null ]; then echo "::error::Couldn't get an access token from the service account key."; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "GCP_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # Published through the Rules REST API rather than `firebase deploy`:
      # the CLI first calls the rules "test" endpoint, which the default
      # Firebase Admin role doesn't allow; creating/releasing rulesets it does.
      - name: Publish Firestore security rules
        run: |
          API="https://firebaserules.googleapis.com/v1/projects/$PROJECT_ID"
          AUTH="Authorization: Bearer $GCP_TOKEN"
          BODY=$(jq -n --rawfile src firestore.rules '{source: {files: [{name: "firestore.rules", content: $src}]}}')
          RES=$(curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" "$API/rulesets" -d "$BODY")
          RULESET=$(echo "$RES" | jq -r '.name // empty')
          if [ -z "$RULESET" ]; then echo "$RES"; echo "::error::Firestore rules were rejected (see above)."; exit 1; fi
          echo "Created $RULESET"
          REL="projects/$PROJECT_ID/releases/cloud.firestore"
          CODE=$(curl -sS -o "$RUNNER_TEMP/rel.json" -w '%{http_code}' -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
            "https://firebaserules.googleapis.com/v1/$REL" \
            -d "$(jq -n --arg n "$REL" --arg r "$RULESET" '{release: {name: $n, rulesetName: $r}}')")
          if [ "$CODE" = 404 ]; then
            CODE=$(curl -sS -o "$RUNNER_TEMP/rel.json" -w '%{http_code}' -X POST -H "$AUTH" -H "Content-Type: application/json" \
              "$API/releases" -d "$(jq -n --arg n "$REL" --arg r "$RULESET" '{name: $n, rulesetName: $r}')")
          fi
          cat "$RUNNER_TEMP/rel.json"; echo
          case "$CODE" in 2*) echo "Firestore rules published.";; *) echo "::error::Couldn't release Firestore rules (HTTP $CODE)."; exit 1;; esac

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@13 deploy --only hosting --project "$PROJECT_ID" --non-interactive

      - name: Show app URL
        run: echo "::notice::App is live at https://$PROJECT_ID.web.app"
