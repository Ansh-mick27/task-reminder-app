name: Deploy web app

on:
  push:
    branches: [main]
    paths: ["web/**", "firebase.json", "firestore.rules", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT secret first (see README)."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "PROJECT_ID=$(jq -r .project_id "$RUNNER_TEMP/sa.json")" >> "$GITHUB_ENV"

      # Proves to Android that the APK and the website belong together, so the
      # app opens full-screen without a browser URL bar.
      - name: Write Digital Asset Links
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret; skipping assetlinks.json (the APK will show a URL bar)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          SHA=$(keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias taskreminder \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          mkdir -p web/.well-known
          cat > web/.well-known/assetlinks.json <<JSON
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "com.anshmick27.taskreminder",
              "sha256_cert_fingerprints": ["$SHA"]
            }
          }]
          JSON
          cat web/.well-known/assetlinks.json

      # Troubleshooting aid: shows which service account the key belongs to and
      # which deploy permissions Google grants it. Never fails the job.
      - name: Check service account permissions
        continue-on-error: true
        run: |
          SA="$RUNNER_TEMP/sa.json"
          EMAIL=$(jq -r .client_email "$SA")
          echo "Service account: $EMAIL"
          jq -r .private_key "$SA" > "$RUNNER_TEMP/key.pem"
          b64() { openssl base64 -e -A | tr '+/' '-_' | tr -d '='; }
          NOW=$(date +%s)
          HEAD=$(printf '{"alg":"RS256","typ":"JWT"}' | b64)
          CLAIMS=$(printf '{"iss":"%s","scope":"https://www.googleapis.com/auth/cloud-platform","aud":"https://oauth2.googleapis.com/token","iat":%s,"exp":%s}' "$EMAIL" "$NOW" "$((NOW + 600))" | b64)
          SIG=$(printf '%s.%s' "$HEAD" "$CLAIMS" | openssl dgst -sha256 -sign "$RUNNER_TEMP/key.pem" | b64)
          rm -f "$RUNNER_TEMP/key.pem"
          TOKEN=$(curl -sS https://oauth2.googleapis.com/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer -d assertion="$HEAD.$CLAIMS.$SIG" | jq -r .access_token)
          echo "::add-mask::$TOKEN"
          echo "Permissions granted on project $PROJECT_ID:"
          curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            "https://cloudresourcemanager.googleapis.com/v1/projects/$PROJECT_ID:testIamPermissions" \
            -d '{"permissions":["firebaserules.rulesets.test","firebaserules.rulesets.create","firebaserules.releases.update","firebasehosting.sites.update","firebase.projects.get"]}'
          echo
          echo "Firebase Rules API status:"
          curl -sS -H "Authorization: Bearer $TOKEN" \
            "https://serviceusage.googleapis.com/v1/projects/$PROJECT_ID/services/firebaserules.googleapis.com" | jq '{state, error}'

      - name: Deploy to Firebase Hosting + Firestore rules
        run: npx --yes firebase-tools@13 deploy --only hosting,firestore:rules --project "$PROJECT_ID" --non-interactive

      - name: Show app URL
        run: echo "::notice::App is live at https://$PROJECT_ID.web.app"
